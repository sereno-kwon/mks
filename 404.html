<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MKS KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/sylvan, /en/lambda ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/mks/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/mks/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'sylvan-road':'sylvan', 'sylvan-touring':'sylvan', 'sylvan-track':'sylvan', 'track':'sylvan', 'grip-king':'lambda', 'gripking':'lambda',
                'allways':'city', 'us-b':'city', 'usb':'city', 'gr-9':'city', 'gr9':'city', 'ezy-system':'ezy', 'quick-release':'ezy',
                'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'pedal-guide':'guide', 'size':'guide', 'lineup':'range' };
  var map = { brand:1, range:1, sylvan:1, lambda:1, city:1, ezy:1, guide:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
