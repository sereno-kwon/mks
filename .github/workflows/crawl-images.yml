name: Crawl mkspedal.com image list

# mkspedal.com 페이지를 돌며 이미지 주소를 .github/mks-images.tsv 로 커밋합니다.
# 매니페스트를 채우기 위한 조사용입니다. 다시 돌리려면 tools/crawl_images.py 를 수정해 푸시하거나 수동 실행합니다.
on:
  push:
    branches: [main]
    paths: [tools/crawl_images.py, .github/workflows/crawl-images.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/crawl_images.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add .github/mks-images.tsv .github/mks-crawl.log
          git diff --cached --quiet && echo "no changes" || git commit -m "Update mkspedal.com image list"
          git pull --rebase && git push
